name: release-mac

on:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - '.github/workflows/release-mac.yml'
      - 'app/**'
      - 'dashboard/**'
      - 'console/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed, notarized DMG to the matching app release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install minisign
      - name: Build unsigned universal test bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PROFILE_RELEASE_STRIP: 'false'
        run: |
          npm ci --no-audit --no-fund --prefix dashboard
          npm ci --no-audit --no-fund --prefix app
          node app/scripts/stage-runtime.mjs
          node app/scripts/stage-python-helper.mjs
          (cd app && npx tauri build --target universal-apple-darwin --bundles app,dmg)
          test -d app/src-tauri/target/universal-apple-darwin/release/bundle/macos/os-lab.app
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          python3 app/scripts/verify-release-signature.py \
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/os-lab.app.tar.gz --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: os-lab-macos-pr-dmg
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  macos:
    # Tag pushes publish automatically once this workflow is enabled and the secrets below exist.
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Check release version
        shell: bash
        run: |
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "app-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
      - name: Import signing certificate and notarization key
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || { echo "Missing $name GitHub secret" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/os-lab-certificate.p12"
          keychain="$RUNNER_TEMP/os-lab-build.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo 'No Developer ID Application identity in imported certificate' >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
      - name: Build, sign and notarize DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push || '${{ inputs.publish }}' == true ]]; then
            ./app/scripts/release-mac.sh --publish
          else
            ./app/scripts/release-mac.sh
          fi
      - name: Upload verified DMG for review
        uses: actions/upload-artifact@v4
        with:
          name: os-lab-macos-universal
          path: app/out/*/os-lab_*_macos_universal.*
          if-no-files-found: error
