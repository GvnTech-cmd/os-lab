name: Firewall Lab — validate & catalog

# As students open PRs adding their dream-company firewalls, validate each
# submission and (re)collect the structured catalog of every firewall and its
# detailed properties. The catalog is published to the job summary on every run.

on:
  push:
    branches: [ master, main, 'feat/**' ]
    paths:
      - 'firewall-lab/**'
      - 'dashboard/src/firewall/**'
      - '.github/workflows/firewall-lab.yml'
  pull_request:
    paths:
      - 'firewall-lab/**'
      - 'dashboard/src/firewall/**'
      - '.github/workflows/firewall-lab.yml'

jobs:
  firewall-lab:
    name: Validate companies & build catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate every company against the schema
        run: python3 firewall-lab/scripts/validate.py

      - name: Collect the firewall catalog (structured list of every firewall + props)
        run: python3 firewall-lab/scripts/catalog.py

      - name: Publish the catalog to the job summary
        if: always()
        run: |
          if [ -f firewall-lab/catalog.md ]; then
            cat firewall-lab/catalog.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check committed catalog is up to date
        run: python3 firewall-lab/scripts/catalog.py --check

      - name: Check dashboard seed is up to date
        run: |
          python3 firewall-lab/scripts/build-seed.py
          if ! git diff --quiet -- dashboard/src/firewall/companies.generated.ts; then
            echo "::error::dashboard/src/firewall/companies.generated.ts is stale."
            echo "Run: python3 firewall-lab/scripts/build-seed.py && git add dashboard/src/firewall/companies.generated.ts"
            git --no-pager diff -- dashboard/src/firewall/companies.generated.ts | head -60
            exit 1
          fi

      - name: Rendered rule sets parse (nft -c, bash -n) for every branch
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables >/dev/null
          out="$(mktemp -d)"; bad=0
          for manifest in firewall-lab/companies/*/company.json; do
            slug="$(basename "$(dirname "$manifest")")"
            dups="$(python3 -c 'import json,sys,collections;c=collections.Counter(b["id"] for b in json.load(open(sys.argv[1]))["branches"]);print(" ".join(k for k,v in c.items() if v>1))' "$manifest")"
            if [ -n "$dups" ]; then echo "::error::$slug has duplicate branch ids ($dups); each branch must be rendered and checked"; bad=1; fi
            for branch in $(python3 -c 'import json,sys;print(" ".join(b["id"] for b in json.load(open(sys.argv[1]))["branches"]))' "$manifest"); do
              python3 firewall-lab/vm/scripts/render-rules.py "$slug" --branch "$branch" --target nft -o "$out/$slug.$branch.nft" >/dev/null
              python3 firewall-lab/vm/scripts/render-rules.py "$slug" --branch "$branch" --target ufw -o "$out/$slug.$branch.sh" >/dev/null
              sudo nft -c -f "$out/$slug.$branch.nft" || { echo "::error::nft rejects $slug/$branch"; bad=1; }
              bash -n "$out/$slug.$branch.sh" || { echo "::error::ufw script for $slug/$branch has a shell syntax error"; bad=1; }
            done
          done
          exit $bad
